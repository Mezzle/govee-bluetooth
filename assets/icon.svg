<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.25" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="0.75" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- LED strip, slightly tilted -->
  <g transform="rotate(-12 128 128)">
    <rect x="12" y="150" width="232" height="44" rx="10" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="18" y="156" width="220" height="32" rx="7" fill="url(#strip)" opacity="0.9"/>
    <g fill="#ffffff" opacity="0.95" filter="url(#glow)">
      <circle cx="44" cy="172" r="7"/>
      <circle cx="86" cy="172" r="7"/>
      <circle cx="128" cy="172" r="7"/>
      <circle cx="170" cy="172" r="7"/>
      <circle cx="212" cy="172" r="7"/>
    </g>
  </g>
  <!-- Bluetooth rune: one path, glow underneath -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="rune" d="M96 70 L160 118 L128 144 V40 L160 66 L96 114"/>
    <use href="#rune" stroke="#38bdf8" stroke-width="18" opacity="0.55" filter="url(#glow)"/>
    <use href="#rune" stroke="#e0f2fe" stroke-width="9"/>
  </g>
</svg>
