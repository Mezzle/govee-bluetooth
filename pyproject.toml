[project]
name = "govee-bluetooth"
version = "0.1.0"
description = "Home Assistant integration controlling Govee lights locally over Bluetooth LE"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
per-file-ignores = { "custom_components/govee_bluetooth/light.py" = ["RUF012"] }
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
